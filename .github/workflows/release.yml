name: Auto Release & Build APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Extract Version & Changelog
        id: extract_info
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PREV_TAG=$(gh release list --limit 1 --json tagName -q '.[0].tagName' 2>/dev/null || echo "")
          export PREV_RELEASE_TAG="$PREV_TAG"

          python - << 'EOF'
          import os
          import re

          # Baca versi dari pubspec.yaml
          with open("pubspec.yaml", "r", encoding="utf-8") as f:
              pub = f.read()
          v_match = re.search(r'version:\s*([0-9]+\.[0-9]+\.[0-9]+)', pub)
          version = v_match.group(1).strip() if v_match else "1.0.0"
          tag = f"v{version}"

          prev_tag = os.environ.get("PREV_RELEASE_TAG", "").strip()
          prev_version = re.sub(r'^v', '', prev_tag) if prev_tag else ""

          notes = f"Release {tag}"
          if os.path.exists("CHANGELOG.md"):
              with open("CHANGELOG.md", "r", encoding="utf-8") as f:
                  cl = f.read()

              start_match = re.search(rf'(## \[{re.escape(version)}\][^\n]*)', cl)
              if start_match:
                  start_idx = start_match.start()
                  # Jika ada rilis sebelumnya di GitHub, ekstrak semua versi hingga tepat sebelum rilis sebelumnya
                  if prev_version and re.search(rf'\n## \[{re.escape(prev_version)}\]', cl[start_idx:]):
                      stop_match = re.search(rf'\n(?=## \[{re.escape(prev_version)}\])', cl[start_idx:])
                      extracted = cl[start_idx : start_idx + stop_match.start()].strip()
                  else:
                      # Rilis pertama (atau rilis sebelumnya tidak ada di CHANGELOG): bawa semua riwayat
                      extracted = cl[start_idx:].strip()

                  extracted = re.sub(r'\n---\s*$', '', extracted).strip()
                  if extracted:
                      notes = extracted

          with open("release_notes.md", "w", encoding="utf-8") as f:
              f.write(notes)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"version={version}\n")
              f.write(f"tag={tag}\n")
          EOF

      - name: Check if Release Already Exists
        id: check_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.extract_info.outputs.tag }}"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Release $TAG sudah ada. Melewati proses build & release."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Release $TAG belum ada. Memulai build APK dan pembuatan rilis..."
          fi

      - name: Set up Java 17
        if: steps.check_release.outputs.exists == 'false'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        if: steps.check_release.outputs.exists == 'false'
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        if: steps.check_release.outputs.exists == 'false'
        run: flutter pub get

      - name: Build Release APK
        if: steps.check_release.outputs.exists == 'false'
        run: flutter build apk --release

      - name: Create GitHub Release with APK
        if: steps.check_release.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.extract_info.outputs.tag }}"
          VERSION="${{ steps.extract_info.outputs.version }}"
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          
          if [ -f "$APK_PATH" ]; then
            gh release create "$TAG" \
              --title "Wall o' Pay $TAG" \
              --notes-file release_notes.md \
              --target main \
              "$APK_PATH#Wall_o_Pay.apk" \
              "$APK_PATH#Wall_o_Pay_${TAG}.apk"
          else
            gh release create "$TAG" \
              --title "Wall o' Pay $TAG" \
              --notes-file release_notes.md \
              --target main
          fi
